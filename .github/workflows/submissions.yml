name: Submissions

# Turns bullet suggestions sent from the app into pull requests, once a day.
on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: submissions

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      # The key signs its own token locally; asking Google for one (token_format)
      # would need the IAM Credentials API enabled in the project.
      - uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3
      - name: Open pull requests
        env:
          FIREBASE_PROJECT: ballistics-kgw
          GH_TOKEN: ${{ github.token }}
        run: FIRESTORE_TOKEN="$(gcloud auth print-access-token)" python3 tools/import_submissions.py
