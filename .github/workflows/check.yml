name: Check

on:
  pull_request:
  # Started by the Submissions workflow for the pull requests it opens.
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Validate bullets
        run: python3 tools/validate.py
